$kind: http-request
name: /api/auth/refresh
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
settings: {}
examples: ./.resources/-api-auth-refresh.resources/examples
order: 1000
